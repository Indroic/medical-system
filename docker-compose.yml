
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Esta DB principal sirve para la inicialización.
      POSTGRES_DB: medical_system
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Script de inicialización para crear las bases separadas (api_db y server_db)
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-migrator:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: "no"
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/api_db
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/api_db
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/api_db
      - SERVER_URL=http://server:3000
      - CELERY_BROKER_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://seaweedfs:8333
      - AWS_ACCESS_KEY_ID=seaweed
      - AWS_SECRET_ACCESS_KEY=seaweed
    # Puertos ocultos: Solo accesibles internamente vía Nginx
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-migrator:
        condition: service_completed_successfully

  api-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    command: ["uv", "run", "celery", "-A", "src.worker", "worker", "--loglevel=info"]
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/api_db
      - SERVER_URL=http://server:3000
      - CELERY_BROKER_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://seaweedfs:8333
      - AWS_ACCESS_KEY_ID=seaweed
      - AWS_SECRET_ACCESS_KEY=seaweed
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-migrator:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      # La URL usará la base de datos server_db (para Better Auth, Hono, etc)
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/server_db
      # URL que Better-Auth usa para generar links y validar requests.
      # En Dokploy debe ser la URL pública del servidor: https://tu-dominio.com/server
      # En dev local: http://localhost:3000
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://server:3000}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-super-secret-key-replace-me}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8080}
      - PYTHON_API_URL=${PYTHON_API_URL:-http://api:8000}
    # Exponer puerto 3000 en caso de no usar proxy externo
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: always
    ports:
      - "8333:8333" # S3 API
    command: "server -s3"
    environment:
      - WEED_S3_ALLOW_EMPTY_FOLDER=true
      - WEED_S3_ALLOW_DELETE_BUCKET_NOT_EMPTY=true
    volumes:
      - seaweedfs_data:/data

  imgproxy:
    image: darthsim/imgproxy:latest
    restart: always
    environment:
      - IMGPROXY_USE_S3=true
      - IMGPROXY_S3_ENDPOINT=http://seaweedfs:8333
      # Para usar seaweedfs sin certificados SSL
      - IMGPROXY_S3_USE_HTTP=true
      # Credenciales fake/internas de S3 para SeaweedFS (por defecto acepta cualquiera si no configuras identity)
      - AWS_ACCESS_KEY_ID=seaweed
      - AWS_SECRET_ACCESS_KEY=seaweed
      - AWS_REGION=us-east-1
      # Desactivamos el firmado obligatorio para la prueba interna
      - IMGPROXY_ENFORCE_SIGNATURE=false
    depends_on:
      - seaweedfs

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # VITE_SERVER_URL debe ser provisto en Dokploy. Default para dev local:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:3000}
        VITE_PYTHON_API_URL: ${VITE_PYTHON_API_URL:-/api}
        # Aseguramos que vite conozca el proxy de las imgs (Dokploy Nginx expondrá esto)
        VITE_IMGPROXY_URL: ${VITE_IMGPROXY_URL:-/imgproxy}
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - api
      - server
      - imgproxy

volumes:
  postgres_data:
  seaweedfs_data:
