
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medical_system
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-migrator:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: "no"
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL_SYNC=postgresql://postgres:postgres@db:5432/medical_api_db
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/medical_api_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/medical_api_db
      - SERVER_URL=http://server:3000
      - CELERY_BROKER_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://seaweedfs:8333
      - AWS_ACCESS_KEY_ID=seaweed
      - AWS_SECRET_ACCESS_KEY=seaweed
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-migrator:
        condition: service_completed_successfully

  api-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    command: ["uv", "run", "celery", "-A", "src.worker", "worker", "--loglevel=info", "-c", "1"]
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/medical_api_db
      - SERVER_URL=http://server:3000
      - CELERY_BROKER_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://seaweedfs:8333
      - AWS_ACCESS_KEY_ID=seaweed
      - AWS_SECRET_ACCESS_KEY=seaweed
      - YOLO_CONFIG_DIR=/tmp/Ultralytics
      - C_FORCE_ROOT=true
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-migrator:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/medical_server_db
      - BETTER_AUTH_URL=http://server:3000
      - BETTER_AUTH_SECRET=super-secret-key-replace-me
      - CORS_ORIGIN=http://localhost:8080
      - PYTHON_API_URL=http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: always
    ports:
      - "8333:8333"
    command: "server -s3"
    environment:
      - WEED_S3_ALLOW_EMPTY_FOLDER=true
      - WEED_S3_ALLOW_DELETE_BUCKET_NOT_EMPTY=true
    volumes:
      - seaweedfs_data:/data

  imgproxy:
    image: darthsim/imgproxy:latest
    restart: always
    environment:
      - IMGPROXY_USE_S3=true
      - IMGPROXY_S3_ENDPOINT=http://seaweedfs:8333
      - IMGPROXY_S3_USE_HTTP=true
      - AWS_ACCESS_KEY_ID=seaweed
      - AWS_SECRET_ACCESS_KEY=seaweed
      - AWS_REGION=us-east-1
      - IMGPROXY_KEY=73757065722d7365637265742d6b6579
      - IMGPROXY_SALT=73757065722d7365637265742d73616c74
      - IMGPROXY_ENFORCE_SIGNATURE=true
    depends_on:
      - seaweedfs

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SERVER_URL: http://localhost:3000
        VITE_PYTHON_API_URL: /api
        VITE_IMGPROXY_URL: /imgproxy
        VITE_IMGPROXY_KEY: 73757065722d7365637265742d6b6579
        VITE_IMGPROXY_SALT: 73757065722d7365637265742d73616c74
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - api
      - server
      - imgproxy

  pgadmin:
    image: dpage/pgadmin4:8.4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@indroic.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  seaweedfs_data:
