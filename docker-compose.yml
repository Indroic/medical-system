
services:
  api-migrator:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: "no"
    command:
      - "sh"
      - "-c"
      - |
        set -e
        echo "=== Verificando estado de migraciones ==="
        # Si la tabla 'pacientes' no existe, alembic_version puede estar
        # corrompida (de un deploy anterior fallido). Hacemos stamp base
        # para forzar la re-aplicación completa desde cero.
        TABLES_EXIST=$(uv run python -c "
import os, re
url = os.environ['DATABASE_URL']
# Normalizar a driver sync (psycopg2)
url = re.sub(r'postgresql\+\w+://', 'postgresql://', url)
import sqlalchemy
e = sqlalchemy.create_engine(url)
try:
    with e.connect() as conn:
        r = conn.execute(sqlalchemy.text(\"SELECT to_regclass('public.pacientes')\"))
        print('yes' if r.scalar() else 'no')
except Exception:
    print('no')
" 2>/dev/null || echo "no")
        echo "Tablas de negocio existen: $TABLES_EXIST"
        if [ "$TABLES_EXIST" = "no" ]; then
          echo "=== Tablas ausentes: reseteando alembic_version a base ==="
          uv run alembic stamp base || true
        fi
        echo "=== Aplicando migraciones ==="
        uv run alembic upgrade head
        echo "=== Migraciones completadas ==="
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - dokploy-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - ASYNC_DATABASE_URL=${ASYNC_DATABASE_URL:?ASYNC_DATABASE_URL must be set}
      - SERVER_URL=http://server:3000
      - BETTER_AUTH_URL=${APP_URL:?APP_URL must be set}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://seaweedfs:8333
      - AWS_ACCESS_KEY_ID=seaweed
      - AWS_SECRET_ACCESS_KEY=seaweed
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      api-migrator:
        condition: service_completed_successfully
    networks:
      - dokploy-network

  api-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    command: ["uv", "run", "celery", "-A", "src.worker", "worker", "--loglevel=info", "-c", "1"]
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - ASYNC_DATABASE_URL=${ASYNC_DATABASE_URL:?ASYNC_DATABASE_URL must be set}
      - SERVER_URL=http://server:3000
      - CELERY_BROKER_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://seaweedfs:8333
      - AWS_ACCESS_KEY_ID=seaweed
      - AWS_SECRET_ACCESS_KEY=seaweed
      - YOLO_CONFIG_DIR=/tmp/Ultralytics
      - C_FORCE_ROOT=true
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
      api-migrator:
        condition: service_completed_successfully
    networks:
      - dokploy-network

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dokploy-network

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}
      - BETTER_AUTH_URL=${APP_URL:?APP_URL must be set}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      - CORS_ORIGIN=${APP_URL:?APP_URL must be set}
      - PYTHON_API_URL=http://api:8000
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    # Servicio interno: lo publica 'web' (proxy) bajo el dominio único. Sin red pública ni puertos.
    networks:
      - dokploy-network


  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: always
    ports:
      - "8333:8333"
    command: "server -s3"
    environment:
      - WEED_S3_ALLOW_EMPTY_FOLDER=true
      - WEED_S3_ALLOW_DELETE_BUCKET_NOT_EMPTY=true
    volumes:
      - seaweedfs_data:/data
    networks:
      - dokploy-network

  imgproxy:
    image: darthsim/imgproxy:latest
    restart: always
    environment:
      - IMGPROXY_USE_S3=true
      - IMGPROXY_S3_ENDPOINT=http://seaweedfs:8333
      - IMGPROXY_S3_USE_HTTP=true
      - AWS_ACCESS_KEY_ID=seaweed
      - AWS_SECRET_ACCESS_KEY=seaweed
      - AWS_REGION=us-east-1
      - IMGPROXY_KEY=73757065722d7365637265742d6b6579
      - IMGPROXY_SALT=73757065722d7365637265742d73616c74
      - IMGPROXY_ENFORCE_SIGNATURE=true
    depends_on:
      - seaweedfs
    networks:
      - dokploy-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    # ÚNICO servicio público: Dokploy le asigna el dominio (APP_URL) vía Traefik sobre dokploy-network.
    # Actúa como proxy de mismo origen: /api -> server, /imgproxy -> imgproxy.
    depends_on:
      - api
      - server
      - imgproxy
    networks:
      - dokploy-network

networks:
  # Red compartida de Dokploy (la crea Dokploy). Solo para el ingress de Traefik
  # del único servicio público: 'web'.
  dokploy-network:
    external: true

volumes:
  seaweedfs_data:
