services:
  medical-postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data_second:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medical-network
    # Sin puertos publicados y sin dokploy-network: completamente aislado, solo accesible
    # desde otros contenedores de medical-network.

  medical-api-migrator:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: "no"
    command: ["sh", "./scripts/migrate.sh"]
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@medical-postgres:5432/${POSTGRES_DB}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      medical-postgres:
        condition: service_healthy
    networks:
      - medical-network

  medical-server-migrator:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    restart: "no"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@medical-postgres:5432/${POSTGRES_DB}
    depends_on:
      medical-postgres:
        condition: service_healthy
    networks:
      - medical-network

  medical-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@medical-postgres:5432/${POSTGRES_DB}
      - ASYNC_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@medical-postgres:5432/${POSTGRES_DB}
      - SERVER_URL=http://medical-server:3000
      - BETTER_AUTH_URL=${APP_URL}
      - CELERY_BROKER_URL=redis://medical-redis:6379/0
      - REDIS_URL=redis://medical-redis:6379/0
      - S3_ENDPOINT=http://medical-seaweedfs:8333
      - AWS_ACCESS_KEY_ID=seaweed
      - AWS_SECRET_ACCESS_KEY=seaweed
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      medical-redis:
        condition: service_healthy
      medical-api-migrator:
        condition: service_completed_successfully
    networks:
      - medical-network

  medical-api-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    command: ["uv", "run", "celery", "-A", "src.worker", "worker", "--loglevel=info", "-c", "1"]
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@medical-postgres:5432/${POSTGRES_DB}
      - ASYNC_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@medical-postgres:5432/${POSTGRES_DB}
      - SERVER_URL=http://medical-server:3000
      - CELERY_BROKER_URL=redis://medical-redis:6379/0
      - REDIS_URL=redis://medical-redis:6379/0
      - S3_ENDPOINT=http://medical-seaweedfs:8333
      - AWS_ACCESS_KEY_ID=seaweed
      - AWS_SECRET_ACCESS_KEY=seaweed
      - YOLO_CONFIG_DIR=/tmp/Ultralytics
      - C_FORCE_ROOT=true
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      medical-redis:
        condition: service_healthy
      medical-api-migrator:
        condition: service_completed_successfully
    networks:
      - medical-network

  medical-redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medical-network

  medical-server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@medical-postgres:5432/${POSTGRES_DB}
      - BETTER_AUTH_URL=${APP_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - CORS_ORIGIN=${APP_URL}
      - PYTHON_API_URL=http://medical-api:8000
      - REDIS_URL=redis://medical-redis:6379/0
    depends_on:
      medical-redis:
        condition: service_healthy
      medical-api:
        condition: service_healthy
      medical-server-migrator:
        condition: service_completed_successfully
    networks:
      - medical-network

  medical-seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: always
    ports:
      - "8333:8333"
    command: "server -s3"
    environment:
      - WEED_S3_ALLOW_EMPTY_FOLDER=true
      - WEED_S3_ALLOW_DELETE_BUCKET_NOT_EMPTY=true
    volumes:
      - seaweedfs_data:/data
    networks:
      - medical-network

  medical-imgproxy:
    image: darthsim/imgproxy:latest
    restart: always
    environment:
      - IMGPROXY_USE_S3=true
      - IMGPROXY_S3_ENDPOINT=http://medical-seaweedfs:8333
      - IMGPROXY_S3_USE_HTTP=true
      - AWS_ACCESS_KEY_ID=seaweed
      - AWS_SECRET_ACCESS_KEY=seaweed
      - AWS_REGION=us-east-1
      - IMGPROXY_KEY=${IMGPROXY_KEY}
      - IMGPROXY_SALT=${IMGPROXY_SALT}
      - IMGPROXY_ENFORCE_SIGNATURE=true
    depends_on:
      - medical-seaweedfs
    networks:
      - medical-network

  medical-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    depends_on:
      - medical-api
      - medical-server
      - medical-imgproxy
    networks:
      - medical-network
      - dokploy-network

  medical-pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      medical-postgres:
        condition: service_healthy
    networks:
      - medical-network
      - dokploy-network

networks:
  medical-network:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  seaweedfs_data:
  postgres_data_second:
  pgadmin_data:
