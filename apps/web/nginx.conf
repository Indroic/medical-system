server {
    listen 80;

    # Docker's internal DNS resolver — required for runtime upstream resolution
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Servir la aplicación React (Vite SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para la API de Inteligencia Artificial (Python/FastAPI)
    # Se remueve el prefijo /api/ para que FastAPI reciba las rutas relativas correctamente
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy reverso para el Auth Server (Node/Better Auth/Hono)
    # Redirige todo bajo /server/ hacia el puerto 3000
    location /server/ {
        set $server_upstream http://server:3000;
        proxy_pass $server_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
