# Preserva el X-Forwarded-Proto que envía Traefik (https); si no viene, usa el scheme local.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;

    # DNS interno de Docker para resolver los upstreams en runtime.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Aplicación React (Vite SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API + Auth + eventos (SSE) -> server Node (Hono).
    # Se conserva el path completo (/api/...): Better-Auth vive en /api/auth y los
    # recursos en /api/<recurso>. El server reenvía internamente a la API Python.
    location /api/ {
        set $server_upstream http://medical-server:3000;
        proxy_pass $server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Streaming / SSE: sin buffering y conexión persistente.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Endpoint de comprobación de setup (server Node)
    location = /check-setup {
        set $server_upstream http://medical-server:3000;
        proxy_pass $server_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Imágenes procesadas -> imgproxy. Se elimina el prefijo /imgproxy/.
    location /imgproxy/ {
        rewrite ^/imgproxy/(.*)$ /$1 break;
        set $imgproxy_upstream http://medical-imgproxy:8080;
        proxy_pass $imgproxy_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}
