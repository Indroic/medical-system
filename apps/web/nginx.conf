server {
    listen 80;
    
    # Servir la aplicación React (Vite SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para la API de Inteligencia Artificial (Python/FastAPI)
    # Se remueve el prefijo /api/ para que FastAPI reciba las rutas relativas correctamente
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_addrs_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy reverso para el Auth Server (Node/Better Auth/Hono)
    # Redirige todo bajo /server/ hacia el puerto 3000
    location /server/ {
        proxy_pass http://server:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_addrs_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
